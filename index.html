$('pairBuild').onclick=async()=>{let f=$('pairPhoto').files[0],g=$('pairInk').files[0];if(!f){$('pairStatus').textContent='Choose a photograph first.';return}let btn=$('pairBuild');btn.disabled=true;$('pairStatus').textContent='Finding enclosed regions…';try{let photo=await pairRead(f),line=g?await pairRead(g):await neuralLineArt(photo);let scale=Math.min(1,900/Math.max(line.width,line.height)),w=Math.round(line.width*scale),h=Math.round(line.height*scale),p=pairPixels(photo,w,h),a=pairPixels(line,w,h),N=w*h,ids=new Int32Array(N);for(let i=0;i<N;i++){let j=i*4;ids[i]=(.299*a[j]+.587*a[j+1]+.114*a[j+2]<(g?160:205))?-1:0}if(!g)closeInkGaps(ids,w,h,4);let regions=[],ink='',c=0;function flood(i,old,id){let q=[i];ids[i]=id;for(let j=0;j<q.length;j++){let t=q[j],x=t%w;for(let n of [x?t-1:-1,x<w-1?t+1:-1,t-w,t+w])if(n>=0&&n<N&&ids[n]===old){ids[n]=id;q.push(n)}}return q}for(let i=0;i<N;i++){if(ids[i]!==-1)continue;let q=flood(i,-1,-2);ink+=traceRegion(q,ids,w,h,-2);for(let t of q)ids[t]=-3}for(let i=0;i<N;i++){if(ids[i]!==0)continue;let q=flood(i,0,++c);if(q.length<12)continue;let sum=[0,0,0],samples=0;for(let t of q){let j=t*4;for(let z=0;z<3;z++)sum[z]+=p[j+z];samples++}let rgb=sum.map(x=>Math.round(x/samples));q.sort((a,b)=>a-b);let len=0,lx=0,ly=0;for(let j=0;j<q.length;){let t=q[j],x=t%w,n=1;while(j+n<q.length&&q[j+n]===t+n&&x+n<w)n++;if(n>len){len=n;lx=x+n/2;ly=Math.floor(t/w)+.5}j+=n}regions.push({d:traceRegion(q,ids,w,h,c),rgb,x:lx,y:ly,len})}if(!regions.length)throw Error('No enclosed light regions found');let boxes=[regions];let k=+$('colors').value;while(boxes.length<k){let best=-1,score=0,axis=0;boxes.forEach((b,i)=>{if(b.length<2)return;for(let a=0;a<3;a++){let lo=255,hi=0;for(let r of b){lo=Math.min(lo,r.rgb[a]);hi=Math.max(hi,r.rgb[a])}if(hi-lo>score){score=hi-lo;best=i;axis=a}}});if(best<0)break;let b=boxes.splice(best,1)[0].sort((a,b)=>a.rgb[axis]-b.rgb[axis]),m=Math.floor(b.length/2);boxes.push(b.slice(0,m),b.slice(m))}boxes.forEach((b,i)=>{let hex='#'+[0,1,2].map(z=>Math.round(b.reduce((s,r)=>s+r.rgb[z],0)/b.length).toString(16).padStart(2,'0')).join('');for(let r of b){r.color=hex;r.id=i+1;delete r.rgb}});loadNumber({w,h,regions,edges:'',ink});$('pairStatus').textContent=regions.length+' enclosed regions; '+boxes.length+' color groups. '}catch(e){$('pairStatus').textContent=e.message}finally{btn.disabled=false}};

function makeLineArt(im){let sc=Math.min(1,900/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc)),p=pairPixels(im,w,h),N=w*h;let gray=new Float32Array(N);for(let i=0;i<N;i++)gray[i]=.299*p[4*i]+.587*p[4*i+1]+.114*p[4*i+2];function blur(a,r){let b=new Float32Array(N),c=new Float32Array(N);for(let y=0;y<h;y++){let v=0;for(let j=-r;j<=r;j++)v+=a[y*w+Math.max(0,Math.min(w-1,j))];for(let x=0;x<w;x++){b[y*w+x]=v/(2*r+1);v+=a[y*w+Math.min(w-1,x+r+1)]-a[y*w+Math.max(0,x-r)]}}for(let x=0;x<w;x++){let v=0;for(let j=-r;j<=r;j++)v+=b[Math.max(0,Math.min(h-1,j))*w+x];for(let y=0;y<h;y++){c[y*w+x]=v/(2*r+1);v+=b[Math.min(h-1,y+r+1)*w+x]-b[Math.max(0,y-r)*w+x]}}return c}let a=blur(gray,2),b=blur(gray,6),mask=new Uint8Array(N);for(let i=0;i<N;i++)mask[i]=b[i]-a[i]>3.5?1:0;let dil=mask.slice();for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let i=y*w+x;if(mask[i-1]||mask[i+1]||mask[i-w]||mask[i+w])dil[i]=1}let closed=dil.slice();for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let i=y*w+x;closed[i]=dil[i]&&dil[i-1]&&dil[i+1]&&dil[i-w]&&dil[i+w]?1:0}let c=document.createElement('canvas');c.width=w;c.height=h;let ctx=c.getContext('2d'),out=ctx.createImageData(w,h);for(let i=0;i<N;i++){let v=closed[i]?0:255;out.data.set([v,v,v,255],4*i)}ctx.putImageData(out,0,0);return c}
 
function closeInkGaps(ids,w,h,r){
 const n=w*h,mask=new Uint8Array(n);for(let i=0;i<n;i++)mask[i]=ids[i]===-1?1:0;
 function pass(src,horizontal,dilate){let dst=new Uint8Array(n);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let v=dilate?0:1;for(let k=-r;k<=r;k++){let xx=horizontal?Math.max(0,Math.min(w-1,x+k)):x,yy=horizontal?y:Math.max(0,Math.min(h-1,y+k));let a=src[yy*w+xx];if(dilate?a:!a){v=dilate?1:0;break}}dst[y*w+x]=v}return dst}
 let closed=pass(pass(pass(pass(mask,true,true),false,true),true,false),false,false);
 for(let i=0;i<n;i++)if(closed[i]||mask[i])ids[i]=-1;
}
async function neuralLineArt(im){
 $('pairStatus').textContent='Loading AI line-art model…';
 if(!window.ort){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js';s.onload=resolve;s.onerror=()=>reject(Error('Could not load AI runtime'));document.head.append(s)})}
 ort.env.wasm.numThreads=1;ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/';
 if(!window.ccSession)window.ccSession=await ort.InferenceSession.create('https://huggingface.co/Buuta/controlnet_aux_onnx/resolve/main/lineart.onnx',{executionProviders:['wasm']});

 $('pairStatus').textContent='AI is drawing your photograph…';
 await new Promise(r=>setTimeout(r,30));
 const meta=session.inputMetadata?.[0]||{}, dims=meta.shape||meta.dimensions||[];
 const nchw=dims.length===4&&dims[1]===3, chw=dims.length===3&&dims[0]===3;
 const w=Number(dims[nchw?3:chw?2:dims.length===3?1:2])||512,h=Number(dims[nchw?2:chw?1:dims.length===3?0:1])||512;
 const p=pairPixels(im,w,h),n=w*h,data=new Uint8Array(3*n);
 for(let i=0;i<n;i++)for(let c=0;c<3;c++)data[nchw||chw?c*n+i:3*i+c]=p[i*4+c];
 const shape=nchw?[1,3,h,w]:chw?[3,h,w]:dims.length===4?[1,h,w,3]:[h,w,3];
 let result;
 try{result=await session.run({[session.inputNames[0]]:new ort.Tensor('uint8',data,shape)})}catch(e){throw Error('AI input '+JSON.stringify(shape)+'; model expects '+JSON.stringify(dims)+': '+e.message)}
 const t=result[session.outputNames[0]],channelLast=t.dims.length>=3&&[1,3,4].includes(t.dims.at(-1)),channels=channelLast?t.dims.at(-1):1,ow=t.dims.at(channelLast?-2:-1),oh=t.dims.at(channelLast?-3:-2);
 if(!ow||!oh||t.data.length<ow*oh)throw Error('Unexpected AI output dimensions');

 let min=Infinity,max=-Infinity;for(let i=0;i<ow*oh;i++){min=Math.min(min,t.data[i*channels]);max=Math.max(max,t.data[i*channels])}
 let mean=0;for(let i=0;i<ow*oh;i++)mean+=(t.data[i*channels]-min)/(max-min||1);mean/=ow*oh;
 for(let i=0;i<ow*oh;i++){let v=(t.data[i*channels]-min)/(max-min||1);if(mean<.5)v=1-v;v=Math.round(v*255);o.data.set([v,v,v,255],4*i)}x.putImageData(o,0,0);

}
$('diagnosticPhoto').onchange=async e=>{const f=e.target.files[0];if(!f)return;const input=e.target;input.disabled=true;$('diagnosticResult').replaceChildren();$('diagnosticStatus').textContent='Loading photograph…';const observer=new MutationObserver(()=>{$('diagnosticStatus').textContent=$('pairStatus').textContent});observer.observe($('pairStatus'),{childList:true,characterData:true,subtree:true});try{const photo=await pairRead(f);const drawing=await neuralLineArt(photo);$('diagnosticResult').replaceChildren(drawing);observer.disconnect();$('diagnosticStatus').textContent='AI line drawing — before region detection or SVG conversion.'}catch(err){observer.disconnect();$('diagnosticStatus').textContent=err.message}finally{observer.disconnect();input.disabled=false;input.value=''}};
