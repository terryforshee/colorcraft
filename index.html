<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ColorCraft</title><style>body{font:16px system-ui;background:#eef4f1;color:#193a32;margin:0}main{max-width:800px;margin:auto;padding:16px}button,label{display:inline-block;padding:12px;background:white;border:1px solid #aabbb5;border-radius:10px;font:inherit;margin:3px}#palette button{width:44px;height:44px;border-radius:50%;padding:0}#palette .active{outline:3px solid #193a32}#stage{background:white;overflow:auto;border-radius:12px}svg{display:block;width:100%;height:auto;touch-action:manipulation}.ink{pointer-events:none}input[type=color]{width:48px;height:44px}#stage{touch-action:none;overscroll-behavior:contain;max-height:70vh}#stage svg{touch-action:none;max-width:none;user-select:none;-webkit-user-select:none}</style></head><body><main><h1>ColorCraft</h1><p>Choose a color and tap an area. Pinch to zoom; drag to pan. Uploaded files stay on your device.</p><label>Open SVG<input hidden type="file" id="file" accept=".svg,image/svg+xml"></label><button id="sample">Sample</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="reset">Reset</button><div id="palette"></div><p id="status"></p><div id="stage"></div><button id="save">Save SVG</button><button id="png">Save PNG</button><button id="plus">+ Zoom</button><button id="minus">− Zoom</button><button id="fit">Fit image</button></main><script>
const $=x=>document.getElementById(x),ns='http://www.w3.org/2000/svg';let color='#e53935',past=[],future=[],original='',zoom=100;const sample='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" stroke="#222" stroke-width="4" fill="white"><rect x="2" y="2" width="396" height="396"/><circle cx="320" cy="70" r="35"/><path d="M2 270 Q90 180 200 260 Q310 180 398 260 V398 H2Z"/><path d="M90 180 L200 90 L310 180Z"/><path d="M110 180 H290 V320 H110Z"/><rect x="175" y="235" width="50" height="85"/><rect x="125" y="200" width="35" height="35"/><rect x="240" y="200" width="35" height="35"/></svg>';
function choose(c){color=c;document.querySelectorAll('#palette button').forEach(b=>b.classList.toggle('active',b.dataset.c===c));$('custom').value=c}
for(const c of ['#e53935','#ff9800','#fdd835','#43a047','#039be5','#3949ab','#8e24aa','#ec407a','#795548','#f5c7a9','#ffffff','#222222']){let b=document.createElement('button');b.style.background=c;b.dataset.c=c;b.setAttribute('aria-label',c);b.onclick=()=>choose(c);$('palette').append(b)}let picker=document.createElement('input');picker.type='color';picker.id='custom';picker.oninput=()=>choose(picker.value);$('palette').append(picker);
function load(s){let root=new DOMParser().parseFromString(s,'image/svg+xml').documentElement;if(root.localName!=='svg'||root.querySelector('parsererror'))throw Error('Invalid SVG');let tags=new Set(['svg','g','path','rect','circle','ellipse','polygon','polyline','line','defs','clipPath','mask','linearGradient','radialGradient','stop']);let attrs=new Set('xmlns viewBox width height x y x1 x2 y1 y2 cx cy r rx ry d points transform fill fill-rule fill-opacity stroke stroke-width stroke-linecap stroke-linejoin stroke-opacity opacity id clip-path mask offset stop-color stop-opacity gradientUnits gradientTransform'.split(' '));function clean(n){let e=document.createElementNS(ns,n.localName);for(let a of n.attributes)if(attrs.has(a.name)&&(!/url\s*\(/i.test(a.value)||/^url\(#[\w.-]+\)$/.test(a.value)))e.setAttribute(a.name,a.value);for(let ch of n.children)if(tags.has(ch.localName))e.append(clean(ch));return e}let svg=clean(root);if(!svg.hasAttribute('viewBox'))svg.setAttribute('viewBox','0 0 '+(parseFloat(svg.getAttribute('width'))||800)+' '+(parseFloat(svg.getAttribute('height'))||800));svg.removeAttribute('width');svg.removeAttribute('height');$('stage').replaceChildren(svg);original=s;zoom=100;past=[];future=[];for(let e of svg.querySelectorAll('path,rect,circle,ellipse,polygon,polyline')){if(e.closest('defs,clipPath,mask'))continue;let f=getComputedStyle(e).fill,m=f.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);if(m&&Math.max(+m[1],+m[2],+m[3])<55)e.classList.add('ink');else if(f!=='none')e.dataset.paint='1'}$('status').textContent=svg.querySelectorAll('[data-paint]').length+' paintable shapes';}
$('stage').onclick=e=>{let a=e.target.closest('[data-paint]');if(!a)return;past.push([a,a.getAttribute('fill'),color]);future=[];a.setAttribute('fill',color)};function apply(a,v){v===null?a.removeAttribute('fill'):a.setAttribute('fill',v)}$('undo').onclick=()=>{let a=past.pop();if(a){apply(a[0],a[1]);future.push(a)}};$('redo').onclick=()=>{let a=future.pop();if(a){apply(a[0],a[2]);past.push(a)}};$('reset').onclick=()=>load(original);$('sample').onclick=()=>load(sample);$('file').onchange=async e=>{try{if(e.target.files[0])load(await e.target.files[0].text())}catch(err){$('status').textContent=err.message}e.target.value=''};
function download(b,n){let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}function copy(){let s=$('stage').firstElementChild.cloneNode(true);s.removeAttribute('style');s.querySelectorAll('[data-paint],.ink').forEach(e=>{e.removeAttribute('data-paint');e.removeAttribute('class')});return s}function xml(s){return new XMLSerializer().serializeToString(s)}$('save').onclick=()=>download(new Blob([xml(copy())],{type:'image/svg+xml'}),'colorcraft.svg');$('png').onclick=()=>{let s=copy(),v=$('stage').firstElementChild.viewBox.baseVal;s.setAttribute('width',1600);s.setAttribute('height',Math.min(8000,Math.max(1,Math.round(1600*v.height/v.width))));let u=URL.createObjectURL(new Blob([xml(s)],{type:'image/svg+xml'})),im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=im.width;c.height=im.height;let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0);URL.revokeObjectURL(u);c.toBlob(b=>{if(b)download(b,'colorcraft.png')})};im.onerror=()=>{$('status').textContent='PNG export failed';URL.revokeObjectURL(u)};im.src=u};function z(n){scaleAt(zoom+n)}$('plus').onclick=()=>z(25);$('minus').onclick=()=>z(-25);load(sample);choose(color);
const stage=$('stage'), fingers=new Map();let gesture=null,blockedUntil=0;
function scaleAt(next,x,y){const svg=stage.firstElementChild;if(!svg)return;const rect=stage.getBoundingClientRect();x=x===undefined?stage.clientWidth/2:x-rect.left;y=y===undefined?stage.clientHeight/2:y-rect.top;const old=zoom;next=Math.max(100,Math.min(600,next));const ax=(stage.scrollLeft+x)/old,ay=(stage.scrollTop+y)/old;zoom=next;svg.style.width=zoom+'%';stage.scrollLeft=ax*zoom-x;stage.scrollTop=ay*zoom-y;}
function pair(){const [a,b]=[...fingers.values()];return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))}}
stage.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(fingers.size===1)gesture={x:e.clientX,y:e.clientY,moved:false};if(fingers.size===2){gesture={...pair(),moved:true};blockedUntil=performance.now()+500;for(const id of fingers.keys())try{stage.setPointerCapture(id)}catch{}}});
stage.addEventListener('pointermove',e=>{if(!fingers.has(e.pointerId))return;fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(fingers.size===2){const p=pair();if(gesture.d){scaleAt(zoom*p.d/gesture.d,gesture.x,gesture.y);stage.scrollLeft+=gesture.x-p.x;stage.scrollTop+=gesture.y-p.y}gesture={...p,moved:true};blockedUntil=performance.now()+500;}else if(fingers.size===1&&gesture){let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(gesture.moved||Math.hypot(dx,dy)>8){stage.scrollLeft-=dx;stage.scrollTop-=dy;gesture={x:e.clientX,y:e.clientY,moved:true};blockedUntil=performance.now()+500;try{stage.setPointerCapture(e.pointerId)}catch{}}}});
function end(e){if(!fingers.has(e.pointerId))return;if(gesture?.moved)blockedUntil=performance.now()+500;fingers.delete(e.pointerId);if(fingers.size===1){const p=[...fingers.values()][0];gesture={...p,moved:true}}else if(!fingers.size)gesture=null}
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
stage.addEventListener('click',e=>{if(fingers.size||performance.now()<blockedUntil){e.preventDefault();e.stopImmediatePropagation()}},true);
$('fit').onclick=()=>{scaleAt(100);stage.scrollLeft=stage.scrollTop=0};

</script></body></html>
