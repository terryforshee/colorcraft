<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ColorCraft</title><style>body{font:16px system-ui;background:#eef4f1;color:#193a32;margin:0}main{max-width:800px;margin:auto;padding:16px}button,label{display:inline-block;padding:12px;background:white;border:1px solid #aabbb5;border-radius:10px;font:inherit;margin:3px}#palette button{width:44px;height:44px;border-radius:50%;padding:0}#palette .active{outline:3px solid #193a32}#stage{background:white;overflow:auto;border-radius:12px}svg{display:block;width:100%;height:auto;touch-action:manipulation}.ink{pointer-events:none}input[type=color]{width:48px;height:44px}#stage{touch-action:none;overscroll-behavior:contain;max-height:70vh}#stage svg{touch-action:none;max-width:none;user-select:none;-webkit-user-select:none}</style></head><body><main><h1>ColorCraft</h1><div style="font-size:13px;color:#526c63;margin-top:-12px;margin-bottom:12px" id="app-version">Version 0.4.0 · November 26, 2026</div><p>Choose a color and tap an area. Pinch to zoom; drag to pan. Uploaded files stay on your device.</p><label>Open SVG<input hidden type="file" id="file" accept=".svg,image/svg+xml"></label><button id="sample">Sample</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="reset">Reset</button><div id="palette"></div><section><label>Open photo<input hidden id="photo" type="file" accept="image/*"></label><label>Colors <select id="colors"><option>32</option><option selected>64</option><option>128</option><option>256</option></select></label><button id="numberSample">Color-by-number sample</button><p id="hint"></p></section><p id="status"></p><div id="stage"></div><button id="save">Save SVG</button><button id="png">Save PNG</button><button id="plus">+ Zoom</button><button id="minus">− Zoom</button><button id="fit">Fit image</button></main><script>
const $=x=>document.getElementById(x),ns='http://www.w3.org/2000/svg';let color='#e53935',past=[],future=[],original='',zoom=100;const sample='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" stroke="#222" stroke-width="4" fill="white"><rect x="2" y="2" width="396" height="396"/><circle cx="320" cy="70" r="35"/><path d="M2 270 Q90 180 200 260 Q310 180 398 260 V398 H2Z"/><path d="M90 180 L200 90 L310 180Z"/><path d="M110 180 H290 V320 H110Z"/><rect x="175" y="235" width="50" height="85"/><rect x="125" y="200" width="35" height="35"/><rect x="240" y="200" width="35" height="35"/></svg>';
function choose(c){color=c;document.querySelectorAll('#palette button').forEach(b=>b.classList.toggle('active',b.dataset.c===c));$('custom').value=c}
for(const c of ['#e53935','#ff9800','#fdd835','#43a047','#039be5','#3949ab','#8e24aa','#ec407a','#795548','#f5c7a9','#ffffff','#222222']){let b=document.createElement('button');b.style.background=c;b.dataset.c=c;b.setAttribute('aria-label',c);b.onclick=()=>choose(c);$('palette').append(b)}let picker=document.createElement('input');picker.type='color';picker.id='custom';picker.oninput=()=>choose(picker.value);$('palette').append(picker);
function load(s){numberMode=false;activeColor=null;clearTimeout(tapTimer);$('palette').hidden=false;$('hint').textContent='';let root=new DOMParser().parseFromString(s,'image/svg+xml').documentElement;if(root.localName!=='svg'||root.querySelector('parsererror'))throw Error('Invalid SVG');let tags=new Set(['svg','g','path','rect','circle','ellipse','polygon','polyline','line','defs','clipPath','mask','linearGradient','radialGradient','stop']);let attrs=new Set('xmlns viewBox width height x y x1 x2 y1 y2 cx cy r rx ry d points transform fill fill-rule fill-opacity stroke stroke-width stroke-linecap stroke-linejoin stroke-opacity opacity id clip-path mask offset stop-color stop-opacity gradientUnits gradientTransform'.split(' '));function clean(n){let e=document.createElementNS(ns,n.localName);for(let a of n.attributes)if(attrs.has(a.name)&&(!/url\s*\(/i.test(a.value)||/^url\(#[\w.-]+\)$/.test(a.value)))e.setAttribute(a.name,a.value);for(let ch of n.children)if(tags.has(ch.localName))e.append(clean(ch));return e}let svg=clean(root);if(!svg.hasAttribute('viewBox'))svg.setAttribute('viewBox','0 0 '+(parseFloat(svg.getAttribute('width'))||800)+' '+(parseFloat(svg.getAttribute('height'))||800));svg.removeAttribute('width');svg.removeAttribute('height');$('stage').replaceChildren(svg);original=s;zoom=100;past=[];future=[];for(let e of svg.querySelectorAll('path,rect,circle,ellipse,polygon,polyline')){if(e.closest('defs,clipPath,mask'))continue;let f=getComputedStyle(e).fill,m=f.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);if(m&&Math.max(+m[1],+m[2],+m[3])<55)e.classList.add('ink');else if(f!=='none')e.dataset.paint='1'}$('status').textContent=svg.querySelectorAll('[data-paint]').length+' paintable shapes';}
$('stage').onclick=e=>{let a=e.target.closest('[data-paint]');if(!a)return;if(numberMode){numberTap(a);return}past.push([a,a.getAttribute('fill'),color]);future=[];a.setAttribute('fill',color)};function apply(a,v){v===null?a.removeAttribute('fill'):a.setAttribute('fill',v)}$('undo').onclick=()=>{let a=past.pop();if(a){apply(a[0],a[1]);future.push(a)}};$('redo').onclick=()=>{let a=future.pop();if(a){apply(a[0],a[2]);past.push(a)}};$('reset').onclick=()=>numberMode?loadNumber(numberOriginal):load(original);$('sample').onclick=()=>load(sample);$('file').onchange=async e=>{try{if(e.target.files[0])load(await e.target.files[0].text())}catch(err){$('status').textContent=err.message}e.target.value=''};
function download(b,n){let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}function copy(){let s=$('stage').firstElementChild.cloneNode(true);s.removeAttribute('style');if(numberMode){s.querySelectorAll('[data-paint]').forEach((e,i)=>{const live=$('stage').querySelectorAll('[data-paint]')[i];if(live.dataset.target&&!live.dataset.done)e.setAttribute('fill','white')});s.querySelectorAll('[data-label]').forEach(e=>e.remove())}s.querySelectorAll('[data-paint],.ink').forEach(e=>{e.removeAttribute('data-paint');e.removeAttribute('class')});return s}function xml(s){return new XMLSerializer().serializeToString(s)}$('save').onclick=()=>download(new Blob([xml(copy())],{type:'image/svg+xml'}),'colorcraft.svg');$('png').onclick=()=>{let s=copy(),v=$('stage').firstElementChild.viewBox.baseVal;s.setAttribute('width',1600);s.setAttribute('height',Math.min(8000,Math.max(1,Math.round(1600*v.height/v.width))));let u=URL.createObjectURL(new Blob([xml(s)],{type:'image/svg+xml'})),im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=im.width;c.height=im.height;let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0);URL.revokeObjectURL(u);c.toBlob(b=>{if(b)download(b,'colorcraft.png')})};im.onerror=()=>{$('status').textContent='PNG export failed';URL.revokeObjectURL(u)};im.src=u};function z(n){scaleAt(zoom+n)}$('plus').onclick=()=>z(25);$('minus').onclick=()=>z(-25);let numberMode=false,activeColor=null,tapTimer=null,lastTap=null,numberOriginal='';load(sample);choose(color);
const stage=$('stage'), fingers=new Map();let gesture=null,blockedUntil=0;
function scaleAt(next,x,y){const svg=stage.firstElementChild;if(!svg)return;const rect=stage.getBoundingClientRect();x=x===undefined?stage.clientWidth/2:x-rect.left;y=y===undefined?stage.clientHeight/2:y-rect.top;const old=zoom;next=Math.max(100,Math.min(600,next));const ax=(stage.scrollLeft+x)/old,ay=(stage.scrollTop+y)/old;zoom=next;svg.style.width=zoom+'%';stage.scrollLeft=ax*zoom-x;stage.scrollTop=ay*zoom-y;}
function pair(){const [a,b]=[...fingers.values()];return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))}}
stage.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(fingers.size===1)gesture={x:e.clientX,y:e.clientY,moved:false};if(fingers.size===2){gesture={...pair(),moved:true};blockedUntil=performance.now()+500;for(const id of fingers.keys())try{stage.setPointerCapture(id)}catch{}}});
stage.addEventListener('pointermove',e=>{if(!fingers.has(e.pointerId))return;fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(fingers.size===2){const p=pair();if(gesture.d){scaleAt(zoom*p.d/gesture.d,gesture.x,gesture.y);stage.scrollLeft+=gesture.x-p.x;stage.scrollTop+=gesture.y-p.y}gesture={...p,moved:true};blockedUntil=performance.now()+500;}else if(fingers.size===1&&gesture){let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(gesture.moved||Math.hypot(dx,dy)>8){stage.scrollLeft-=dx;stage.scrollTop-=dy;gesture={x:e.clientX,y:e.clientY,moved:true};blockedUntil=performance.now()+500;try{stage.setPointerCapture(e.pointerId)}catch{}}}});
function end(e){if(!fingers.has(e.pointerId))return;if(gesture?.moved)blockedUntil=performance.now()+500;fingers.delete(e.pointerId);if(fingers.size===1){const p=[...fingers.values()][0];gesture={...p,moved:true}}else if(!fingers.size)gesture=null}

$('fit').onclick=()=>{scaleAt(100);stage.scrollLeft=stage.scrollTop=0};


function refreshNumber(){let all=[...stage.querySelectorAll('[data-paint]')],remaining=0,done=0;for(let a of all){if(a.dataset.done){a.setAttribute('fill',a.dataset.target);done++}else{let match=a.dataset.target===activeColor;a.setAttribute('fill',match?'url(#ccChecker)':'white');if(match)remaining++}let label=stage.querySelector('[data-label="'+a.dataset.region+'"]');if(label)label.style.display=a.dataset.done?'none':''}if(!remaining)activeColor=null;$('status').textContent=done+' / '+all.length+' regions completed';$('hint').textContent=remaining?remaining+' matching regions — tap each to reveal its color.':'Double-tap any unfinished region to find matching colors.'}
function numberTap(a){if(a.dataset.done)return;let now=performance.now();if(lastTap&&lastTap.a===a&&now-lastTap.t<350){clearTimeout(tapTimer);lastTap=null;activeColor=a.dataset.target;refreshNumber();return}clearTimeout(tapTimer);lastTap={a,t:now};tapTimer=setTimeout(()=>{lastTap=null;if(a.dataset.target===activeColor&&!a.dataset.done){a.dataset.done='1';past.push(a);future=[];refreshNumber()}},350)}
const oldUndo=$('undo').onclick,oldRedo=$('redo').onclick;$('undo').onclick=()=>{if(!numberMode)return oldUndo();let a=past.pop();if(a){delete a.dataset.done;future.push(a);refreshNumber()}};$('redo').onclick=()=>{if(!numberMode)return oldRedo();let a=future.pop();if(a){a.dataset.done='1';past.push(a);refreshNumber()}};
function loadNumber(data){let {w,h,regions,edges}=typeof data==='string'?JSON.parse(data):data;numberOriginal=JSON.stringify({w,h,regions,edges});let markup='<svg xmlns="'+ns+'" viewBox="0 0 '+w+' '+h+'">'+regions.map(r=>'<path fill="white" fill-rule="evenodd" stroke="#333" stroke-width=".65" stroke-linejoin="round" d="'+r.d+'"/>').join('')+'<path fill="none" stroke="#555" stroke-width=".35" d="'+edges+'"/></svg>';load(markup);numberMode=true;$('palette').hidden=true;let svg=stage.firstElementChild;let defs=document.createElementNS(ns,'defs');defs.innerHTML='<pattern id="ccChecker" patternUnits="userSpaceOnUse" width="4" height="4"><rect width="4" height="4" fill="#fff"/><path d="M0 0h2v2H0zM2 2h2v2H2z" fill="#a9a9a9"/></pattern>';svg.prepend(defs);let shapes=svg.querySelectorAll('[data-paint]');regions.forEach((r,i)=>{let a=shapes[i];a.dataset.target=r.color;a.dataset.region=i;if(r.len>=8){let t=document.createElementNS(ns,'text');t.setAttribute('x',r.x);t.setAttribute('y',r.y+.35);t.setAttribute('font-size',Math.min(3,r.len/3));t.setAttribute('text-anchor','middle');t.setAttribute('fill','#666');t.setAttribute('pointer-events','none');t.dataset.label=i;t.textContent=r.id;svg.append(t)}});svg.querySelector('path[fill="none"]').setAttribute('pointer-events','none');refreshNumber()}
function convertPixels(p,w,h,k){let hist=new Map();for(let i=0;i<p.length;i+=4){let key=((p[i]>>3)<<10)|((p[i+1]>>3)<<5)|(p[i+2]>>3);hist.set(key,(hist.get(key)||0)+1)}let bins=[...hist].map(([key,n])=>({key,n,c:[((key>>10)&31)*8+4,((key>>5)&31)*8+4,(key&31)*8+4]}));let boxes=[bins];while(boxes.length<k){let best=-1,score=-1,axis=0;boxes.forEach((b,i)=>{if(b.length<2)return;for(let a=0;a<3;a++){let lo=255,hi=0;for(let v of b){lo=Math.min(lo,v.c[a]);hi=Math.max(hi,v.c[a])}if(hi-lo>score){score=hi-lo;best=i;axis=a}}});if(best<0)break;let b=boxes.splice(best,1)[0].sort((a,b)=>a.c[axis]-b.c[axis]),total=b.reduce((s,v)=>s+v.n,0),sum=0,j=0;while(j<b.length-1&&sum<total/2)sum+=b[j++].n;j=Math.max(1,j);boxes.push(b.slice(0,j),b.slice(j))}let lookup=new Map(),palette=boxes.map((b,i)=>{let n=b.reduce((s,v)=>s+v.n,0);b.forEach(v=>lookup.set(v.key,i));return '#'+[0,1,2].map(a=>Math.round(b.reduce((s,v)=>s+v.c[a]*v.n,0)/n).toString(16).padStart(2,'0')).join('')});let ids=new Uint16Array(w*h);for(let i=0;i<ids.length;i++){let j=i*4;ids[i]=lookup.get(((p[j]>>3)<<10)|((p[j+1]>>3)<<5)|(p[j+2]>>3))}for(let pass=0;pass<2;pass++){let next=ids.slice();for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let i=y*w+x,a=[ids[i-1],ids[i+1],ids[i-w],ids[i+w]];for(let v of a)if(a.filter(q=>q===v).length>=3){next[i]=v;break}}ids=next}ids=mergeSmall(ids,w,h,palette,20);let seen=new Uint8Array(ids.length),regions=[],edges='';for(let i=0;i<ids.length;i++){let x=i%w,y=Math.floor(i/w);if(x===0||ids[i-1]!==ids[i])edges+='M'+x+' '+y+'v1';if(y===0||ids[i-w]!==ids[i])edges+='M'+x+' '+y+'h1';if(x===w-1)edges+='M'+w+' '+y+'v1';if(y===h-1)edges+='M'+x+' '+h+'h1';if(seen[i])continue;let q=[i],c=ids[i];seen[i]=1;for(let j=0;j<q.length;j++){let t=q[j],xx=t%w;for(let n of [xx?t-1:-1,xx<w-1?t+1:-1,t-w,t+w])if(n>=0&&n<ids.length&&!seen[n]&&ids[n]===c){seen[n]=1;q.push(n)}}q.sort((a,b)=>a-b);let d='',len=0,lx=0,ly=0;for(let j=0;j<q.length;){let t=q[j],x=t%w,y=Math.floor(t/w),n=1;while(j+n<q.length&&q[j+n]===t+n&&x+n<w)n++;d+='M'+x+' '+y+'h'+n+'v1h-'+n+'z';if(n>len){len=n;lx=x+n/2;ly=y+.5}j+=n}regions.push({d:traceRegion(q,ids,w,h,c),color:palette[c],id:c+1,x:lx,y:ly,len})}return {w,h,regions,edges:''}}
$('photo').onchange=async e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);try{let im=new Image();im.src=u;await im.decode();let ratio=Math.min(1,320/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*ratio)),h=Math.max(1,Math.round(im.height*ratio)),c=document.createElement('canvas');c.width=w;c.height=h;let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,w,h);ctx.filter='blur(1.2px)';ctx.drawImage(im,0,0,w,h);ctx.filter='none';loadNumber(convertPixels(ctx.getImageData(0,0,w,h).data,w,h,+$('colors').value))}catch(err){$('hint').textContent='Photo conversion failed: '+err.message}finally{URL.revokeObjectURL(u);e.target.value=''}};
$('numberSample').onclick=()=>{let c=document.createElement('canvas');c.width=160;c.height=120;let x=c.getContext('2d');x.fillStyle='#87ceeb';x.fillRect(0,0,160,120);x.fillStyle='#59a650';x.fillRect(0,80,160,40);x.fillStyle='#e4b47c';x.fillRect(45,45,70,55);x.fillStyle='#b54435';x.beginPath();x.moveTo(35,45);x.lineTo(80,12);x.lineTo(125,45);x.fill();x.fillStyle='#395d9a';x.fillRect(52,55,15,15);x.fillRect(93,55,15,15);x.fillStyle='#754b30';x.fillRect(74,75,12,25);loadNumber(convertPixels(x.getImageData(0,0,160,120).data,160,120,12))};

function mergeSmall(ids,w,h,palette,min){const rgb=palette.map(c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)));for(let pass=0;pass<5;pass++){let seen=new Uint8Array(ids.length),changed=0;for(let i=0;i<ids.length;i++){if(seen[i])continue;let c=ids[i],q=[i],border=new Map();seen[i]=1;for(let j=0;j<q.length;j++){let t=q[j],x=t%w;for(let n of [x?t-1:-1,x<w-1?t+1:-1,t-w,t+w]){if(n<0||n>=ids.length)continue;let v=ids[n];if(v===c){if(!seen[n]){seen[n]=1;q.push(n)}}else border.set(v,(border.get(v)||0)+1)}}if(q.length>=min||!border.size)continue;let best=c,score=-Infinity;for(let [v,count] of border){let dist=rgb[c].reduce((a,x,j)=>a+(x-rgb[v][j])**2,0),s=count/(1+Math.sqrt(dist)/35);if(s>score){score=s;best=v}}for(let t of q)ids[t]=best;changed+=q.length}if(!changed)break}return ids}
function traceRegion(q,ids,w,h,c){const stride=w+1,adj=new Map();function edge(x,y,X,Y){let a=y*stride+x,b=Y*stride+X;if(!adj.has(a))adj.set(a,[]);adj.get(a).push(b)}for(let t of q){let x=t%w,y=Math.floor(t/w);if(y===0||ids[t-w]!==c)edge(x,y,x+1,y);if(x===w-1||ids[t+1]!==c)edge(x+1,y,x+1,y+1);if(y===h-1||ids[t+w]!==c)edge(x+1,y+1,x,y+1);if(x===0||ids[t-1]!==c)edge(x,y+1,x,y)}let d='';const xy=a=>[a%stride,Math.floor(a/stride)],fmt=p=>p.map(v=>Math.round(v*100)/100).join(' ');while(adj.size){let start=adj.keys().next().value,a=start,loop=[],limit=q.length*4+4;do{loop.push(xy(a));let list=adj.get(a);if(!list?.length)break;let b=list.pop();if(!list.length)adj.delete(a);a=b}while(a!==start&&--limit);if(a!==start||loop.length<3)continue;let pts=loop.filter((p,i)=>{let u=loop[(i+loop.length-1)%loop.length],v=loop[(i+1)%loop.length];return (p[0]-u[0])*(v[1]-p[1])!==(p[1]-u[1])*(v[0]-p[0])});if(pts.length<3)pts=loop;const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];d+='M'+fmt(mid(pts[pts.length-1],pts[0]));for(let i=0;i<pts.length;i++){let p=pts[i],n=pts[(i+1)%pts.length],prev=pts[(i+pts.length-1)%pts.length];let dist=Math.min(.65,Math.hypot(p[0]-prev[0],p[1]-prev[1])/2,Math.hypot(n[0]-p[0],n[1]-p[1])/2);let toward=(a,b)=>{let l=Math.hypot(b[0]-a[0],b[1]-a[1]);return [a[0]+(b[0]-a[0])*dist/l,a[1]+(b[1]-a[1])*dist/l]};d+='L'+fmt(toward(p,prev))+'Q'+fmt(p)+' '+fmt(toward(p,n))}d+='Z'}return d}
